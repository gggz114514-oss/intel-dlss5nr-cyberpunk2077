name: Publish Experimental

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-experimental]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/contents/RELEASE-NOTES.md?ref=$GITHUB_SHA" --jq .content | base64 --decode > release-notes.md
          gh release create v0.1.0-experimental --target "$GITHUB_SHA" --title "v0.1.0 Experimental" --prerelease --notes-file release-notes.md
